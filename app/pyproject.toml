[tool.briefcase]
project_name = "Kana Memory"
bundle = "org.example.demo"
version = "0.36.6"
url = "https://example.org/kana-memory"
license = "MIT"
author = "Kana Memory personal project"
author_email = "local@example.org"

[tool.briefcase.app.kanamemory]
formal_name = "KanaMemoryDemo"
description = "Kana study with handwriting recognition and spaced repetition"
sources = ["src/kanamemory"]
requires = ["fsrs==6.3.2"]

[tool.briefcase.app.kanamemory.android]
requires = ["toga-android==0.5.7", "toga-core==0.5.7", "travertino==0.5.7", "typing-extensions==4.16.0"]
template = "https://github.com/beeware/briefcase-android-gradle-template.git"
template_branch = "32244ad8bd608cc451f05718d07f2e3429541333"
template_hash = "sha1:32244ad8bd608cc451f05718d07f2e3429541333"
min_os_version = "26"
target_os_version = "36"
android_abis = ["arm64-v8a", "x86_64"]
base_theme = "Theme.MaterialComponents.Light.NoActionBar"
# One MainActivity per task; launcher/share intents reach it via onNewIntent. configChanges is
# hard-coded by the template, so environment/run_app.ps1 adds assetsPaths after generation.
android_manifest_activity_attrs_extra_content = 'android:launchMode="singleTask"'
# Content library files (.kmlib, design 08 section 16.8): ACTION_VIEW opens them with the app, which shows
# their precheck (never installs). (a) the app's own type; (b) application/octet-stream, the type providers
# give an unknown extension; (c) any type, or none, with a path ending in .kmlib (pathSuffix from Android 12;
# pathPattern matches a fixed number of dots, so one per count). Never application/zip. No permission.
# environment/run_app.ps1 (Set-KanaAndroidManifest) adds the same filters to a project generated before.
android_manifest_activity_extra_content = '''
<intent-filter>
    <action android:name="android.intent.action.VIEW" />
    <category android:name="android.intent.category.DEFAULT" />
    <category android:name="android.intent.category.BROWSABLE" />
    <data android:scheme="content" />
    <data android:scheme="file" />
    <data android:mimeType="application/vnd.kanamemory.library" />
</intent-filter>
<intent-filter>
    <action android:name="android.intent.action.VIEW" />
    <category android:name="android.intent.category.DEFAULT" />
    <category android:name="android.intent.category.BROWSABLE" />
    <data android:scheme="content" />
    <data android:scheme="file" />
    <data android:mimeType="application/octet-stream" />
</intent-filter>
<intent-filter>
    <action android:name="android.intent.action.VIEW" />
    <category android:name="android.intent.category.DEFAULT" />
    <category android:name="android.intent.category.BROWSABLE" />
    <data android:scheme="content" />
    <data android:scheme="file" />
    <data android:mimeType="*/*" />
    <data android:host="*" />
    <data android:pathSuffix=".kmlib" />
    <data android:pathPattern=".*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\..*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\..*\\..*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\..*\\..*\\..*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\..*\\..*\\..*\\..*\\..*\\..*\\.kmlib" />
</intent-filter>
<intent-filter>
    <action android:name="android.intent.action.VIEW" />
    <category android:name="android.intent.category.DEFAULT" />
    <category android:name="android.intent.category.BROWSABLE" />
    <data android:scheme="content" />
    <data android:scheme="file" />
    <data android:host="*" />
    <data android:pathSuffix=".kmlib" />
    <data android:pathPattern=".*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\..*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\..*\\..*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\..*\\..*\\..*\\..*\\..*\\.kmlib" />
    <data android:pathPattern=".*\\..*\\..*\\..*\\..*\\..*\\..*\\..*\\..*\\..*\\.kmlib" />
</intent-filter>
'''
android_manifest_extra_content = '''
<queries>
    <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
</queries>
'''
build_gradle_dependencies = [
    "com.google.android.material:material:1.13.0",
    "com.google.mlkit:digital-ink-recognition:19.0.0",
]
build_gradle_extra_content = '''
chaquopy {
    defaultConfig {
        buildPython System.getenv("KANA_BUILD_PYTHON")
    }
}
'''

[tool.briefcase.app.kanamemory.windows]
requires = ["toga-winforms==0.5.7"]
